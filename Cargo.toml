[workspace]
# One repository, two published crates. The binary is NOT a `[[bin]]` of the library: the crate
# boundary keeps "the library returns values — it never prints, never exits, never touches the
# filesystem" true in the MANIFEST and not only in prose, and it means a dependency the CLI might
# want lands on CLI builders rather than on every library consumer. One release covers both.
members = ["crates/muhtesip", "crates/muhtesip-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# Verified, not asserted: `cargo +1.85.0 check --workspace --all-targets` passes, and CI runs the same
# check on every push. The one thing that had made it false was a let-chain (stabilised in 1.88) in the
# events rule — the code now says so where it matters. Do not raise this without a reason a user would
# recognise, and re-run the check when you do.
rust-version = "1.85"
license = "MIT"
# `license` is the SPDX expression the registry and consumers read. The TEXT has to travel with every
# copy too, and cargo only picks up a licence file it can see from the package directory —
# `crates/<crate>/` — so each crate carries a LICENSE symlink to this one. One source of truth, and
# `cargo package` dereferences the link: the tarball's LICENSE is the real text, verified.
repository = "https://github.com/brsbyrk/muhtesip"

[workspace.dependencies]
globset = "0.4.16"
regex = "1.11.1"
thiserror = "2.0.21"
yaml-rust2 = "0.13.0"
# A real JSON parser, used ONLY by tests: the envelope is written by hand in `src/report.rs`, and a
# test that parses it with an actual parser is a proof, where a test that only compares strings to
# what the same code produced is not. Dev-only, so the shipped binary gains no dependency.
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
# Every public item carries a doc comment; the clippy lint below extends that to private ones.
missing_docs = "warn"

[workspace.lints.clippy]
# expect_used is deliberately NOT set: it fires on every expect, so it cannot express
# "an expect must carry a message". unwrap() has no such excuse.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
# Every method, field, constant and variant carries a doc comment, private or not — the gate runs
# clippy with `-D warnings`, so a new undocumented item fails CI rather than drifting in.
missing_docs_in_private_items = "warn"

# Profiles live HERE, not in a member: a profile declared in a member is ignored with a warning, which
# is how another project shipped a CLI whose dependency graph was never optimised.
[profile.dev]
opt-level = 1
debug = 1

[profile.release]
lto = true
strip = true
opt-level = 3

# Opt-level 2 on dev deps is the common advice and often WRONG: measured, it made a
# cold build 3.3x slower for a 0% faster I/O-bound test suite. Add it only for a
# CPU-bound suite, with the measurement recorded here.
